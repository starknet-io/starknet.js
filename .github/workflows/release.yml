name: '[Manual|PR] Release'
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug'
        type: boolean
        default: true
      dry-run:
        description: 'Dry run'
        type: boolean
        default: true
  pull_request:
    branches:
      - main
      - beta
      - develop
      - next-version
    paths:
      - '__mocks__/**'
      - '__tests__/**'
      - 'src/**'
      - 'package*'
      - 'ts*'
      # a change to the release configuration must be able to run the release
      - '.releaserc*'
      # a change to a workflow must be able to run the workflow it changes
      - '.github/workflows/**'
      - '!www/**'
  push:
    branches:
      - main
      - beta
      - develop
      - next-version
    paths:
      - '__mocks__/**'
      - '__tests__/**'
      - 'src/**'
      - 'package*'
      - 'ts*'
      # a change to the release configuration must be able to run the release
      - '.releaserc*'
      # a change to a workflow must be able to run the workflow it changes
      - '.github/workflows/**'
      - '!www/**'

# Default every read-only job to the minimum token scope. Release jobs override
# this with the additional write permissions they need below.
permissions:
  contents: read

# Cancel redundant in-progress runs of the same pull request (replaces the
# `cancel_others` behaviour of the now-unmaintained skip-duplicate-actions).
# `cancel-in-progress` is read from the run that arrives, not from the run in progress.
# So pull request runs get their own group (`pr`). After a merge, GitHub can start a
# late `pull_request` run on the ref of the base branch: in a shared group, it would
# cancel the push run in progress.
# `push` and `workflow_dispatch` share the `release` group: both run semantic-release,
# and must never run it twice at the same time on one branch. A run in progress in
# this group is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pr' || 'release' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-dev:
    name: Run test on rpc-devnet
    if: |
      github.event_name != 'workflow_dispatch'
      && contains(fromJSON('["beta","develop","next-version"]'), github.base_ref || github.ref_name)

    uses: ./.github/workflows/_test.yml
    with:
      use-devnet: true

  tests-main:
    name: Run test on ${{ matrix.node }} ${{ matrix.version }}
    if: |
      github.event_name != 'workflow_dispatch'
      && (github.base_ref || github.ref_name) == 'main'
    strategy:
      max-parallel: 1
      fail-fast: false
      # No protocol axis: each job now exercises every transport its urls allow, so splitting
      # RPC from WS would only run the same suites twice across two jobs.
      matrix:
        node: [Juno, Pathfinder]
        version: [v0_9, v0_10]

    uses: ./.github/workflows/_test.yml
    with:
      node: ${{ matrix.node }}
      version: ${{ matrix.version }}
    secrets: inherit

  # Builds, packs and installs the package as a user would: a broken entry point blocks the release.
  package-check:
    name: Check the built package
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/_package.yml

  release-auto:
    name: Release
    needs: [tests-dev, tests-main, package-check]
    # `always()` is needed: without it, a skipped test job would skip the release too
    # (tests-main is skipped on every branch but `main`).
    # `!failure()` blocks the release when a test job fails.
    # `failure()` does not count a cancelled job. So `!cancelled()` and the check of
    # `needs.*.result` block the release when the run or a test job is cancelled.
    # Without them, a `feat:` or `fix:` commit would be published with unfinished tests.
    # semantic-release is idempotent (no version bump = no publish), so running it on
    # a duplicate push is safe.
    if: |
      always()
      && !failure()
      && !cancelled()
      && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'push'
    uses: ./.github/workflows/_release.yml
    secrets: inherit
    permissions:
      packages: write
      pull-requests: write
      contents: write
      issues: write
      id-token: write

  release-manual:
    name: Release (manual)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_release.yml
    with:
      debug: ${{ inputs.debug }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
    permissions:
      packages: write
      pull-requests: write
      contents: write
      issues: write
      id-token: write
