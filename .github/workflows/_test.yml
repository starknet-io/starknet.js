name: _ Run Tests
on:
  workflow_call:
    inputs:
      use-devnet:
        type: boolean
        default: false
      ignore-scripts:
        type: boolean
        default: false
      node:
        # Juno, Pathfinder
        type: string
      version:
        # vX_Y
        type: string
    secrets:
      # Base domain of the Starknet Foundation nodes (bare host, no scheme or path).
      # Not needed when use-devnet is set.
      SNF_NODE_URL:
        required: false
      TEST_ACCOUNT_PRIVATE_KEY:
        required: false
      TEST_ACCOUNT_ADDRESS:
        required: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    # TODO - periodically check if conditional services are supported; https://github.com/actions/runner/issues/822
    services:
      devnet:
        image: ${{ (inputs.use-devnet) && 'shardlabs/starknet-devnet-rs:0.9.0' || '' }}
        ports:
          - 5050:5050

    env:
      USE_DEVNET: ${{ inputs.use-devnet }}
      NODE: ${{ inputs.node == 'Juno' && 'juno' || inputs.node == 'Pathfinder' && 'pathfinder' || '' }}
      VERSION: ${{ inputs.version }}

      SNF_NODE_URL: ${{ secrets.SNF_NODE_URL }}
      TEST_ACCOUNT_PRIVATE_KEY: ${{ secrets.TEST_ACCOUNT_PRIVATE_KEY }}
      TEST_ACCOUNT_ADDRESS: ${{ secrets.TEST_ACCOUNT_ADDRESS }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run pretest && npm run posttest
        if: ${{ !inputs.ignore-scripts }}
      - id: node-url
        name: resolve node urls
        # Against the devnet service started above, both urls are fixed — devnet serves
        # plain JSON-RPC and subscriptions on a dedicated /ws path. Otherwise the urls
        # are built from the Starknet Foundation base domain:
        #   https://sepolia.<domain>/<node>/rpc/<version>
        #   wss://sepolia.<domain>/<node>/ws/<version>
        # Both are always emitted: the runner decides what to run from the urls alone, and an
        # rpc url is needed in every case — the WebSocket suites drive an account over HTTP.
        run: |
          if [ "$USE_DEVNET" = 'true' ]; then
            rpc_url='http://127.0.0.1:5050/rpc'
            ws_url='ws://127.0.0.1:5050/ws'
          elif [ -n "$SNF_NODE_URL" ] && [ -n "$NODE" ] && [ -n "$VERSION" ]; then
            base="sepolia.$SNF_NODE_URL/$NODE"
            rpc_url="https://$base/rpc/$VERSION"
            ws_url="wss://$base/ws/$VERSION"
            echo "::add-mask::$rpc_url"
            echo "::add-mask::$ws_url"
          else
            echo "::error::No node url available: set use-devnet, or provide the node and version inputs together with the SNF_NODE_URL secret."
            exit 1
          fi
          echo "rpc-url=$rpc_url" >> "$GITHUB_OUTPUT"
          echo "ws-url=$ws_url" >> "$GITHUB_OUTPUT"
      - id: run-tests
        name: run tests
        # No path filter and no protocol flag: a single run covers every category the resolved
        # urls allow — unit once, the node-touching suites once per transport, and the WebSocket
        # suites on top. `--forceExit` must not come back either; the suites close their own
        # sockets, so a run that hangs here is a real leak and must not be papered over.
        run: npm run test:coverage
        env:
          TEST_RPC_URL: ${{ steps.node-url.outputs.rpc-url }}
          TEST_WS_URL: ${{ steps.node-url.outputs.ws-url }}
          TEST_ACCOUNT_PRIVATE_KEY: ${{ secrets.TEST_ACCOUNT_PRIVATE_KEY }}
          TEST_ACCOUNT_ADDRESS: ${{ secrets.TEST_ACCOUNT_ADDRESS }}
